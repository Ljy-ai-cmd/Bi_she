# Anti-UAV 红外无人机检测 - YOLOv8 训练配置文件
# 针对红外图像特点优化的训练配置

# ==================== 任务设置 ====================
task: detect  # 检测任务
mode: train   # 训练模式

# ==================== 模型配置 ====================
model: yolov8s.yaml  # 模型配置文件
# 可选: yolov8n.yaml (nano), yolov8s.yaml (small), yolov8m.yaml (medium), yolov8l.yaml (large), yolov8x.yaml (xlarge)

# ==================== 数据集配置 ====================
data: data/AntI-UAV/yolo_format/anti_uav.yaml  # 数据集配置文件路径

# ==================== 训练参数 ====================
epochs: 200           # 训练轮数（红外数据集通常需要更多轮数）
patience: 30          # 早停耐心值
batch: 16             # 批次大小（根据GPU显存调整）
imgsz: 640            # 输入图像尺寸

# ==================== 优化器设置 ====================
optimizer: SGD        # 优化器: SGD, Adam, AdamW, RMSprop
lr0: 0.01             # 初始学习率
lrf: 0.01             # 最终学习率 = lr0 * lrf
momentum: 0.937       # SGD动量 / Adam beta1
weight_decay: 0.0005  # 权重衰减
warmup_epochs: 3.0    # 预热轮数
warmup_momentum: 0.8  # 预热初始动量
warmup_bias_lr: 0.1   # 预热偏置学习率

# ==================== 损失函数权重 ====================
box: 7.5              # 边框损失增益
cls: 0.5              # 分类损失增益
dfl: 1.5              # 分布焦点损失增益

# ==================== 数据增强参数（针对红外图像优化） ====================
# HSV增强 - 红外图像主要调整亮度和对比度
hsv_h: 0.015          # HSV色调增强 (0-1)
hsv_s: 0.3            # HSV饱和度增强 (降低，红外图像饱和度较低)
hsv_v: 0.5            # HSV亮度增强 (提高，适应红外图像亮度变化)

# 几何变换
degrees: 5.0          # 旋转角度 (+/- deg) - 无人机可能有各种角度
translate: 0.1        # 平移 (+/- fraction)
scale: 0.5            # 缩放 (+/- gain) - 重要：无人机尺度变化大
shear: 2.0            # 剪切 (+/- deg)
perspective: 0.0      # 透视变换 (0-0.001)

# 翻转
flipud: 0.0           # 上下翻转概率 (无人机通常不会上下翻转)
fliplr: 0.5           # 左右翻转概率

# 高级增强
mosaic: 1.0           # Mosaic增强概率（对红外小目标检测很有帮助）
mixup: 0.1            # MixUp增强概率
auto_augment: randaugment  # 自动增强策略

# ==================== 红外图像特定增强 ====================
# 自定义增强参数（需要在代码中实现）
ir_brightness: 0.3    # 红外亮度调整范围
ir_contrast: 0.3      # 红外对比度调整范围
ir_noise: 0.05        # 高斯噪声（模拟红外传感器噪声）
ir_blur: 0.1          # 模糊概率（模拟失焦）

# ==================== 训练策略 ====================
cos_lr: True          # 使用余弦学习率调度
close_mosaic: 10      # 最后10轮关闭mosaic增强

# ==================== 硬件设置 ====================
device: 0            # GPU设备，0表示第一块GPU
workers: 8           # 数据加载工作线程数
pretrained: True     # 使用预训练权重

# ==================== 保存设置 ====================
save: True           # 保存检查点
save_period: 10      # 每10轮保存一次
project: runs/detect # 项目保存路径
name: anti_uav_ir    # 实验名称
exist_ok: False      # 是否覆盖已有实验

# ==================== 验证设置 ====================
val: True            # 训练时进行验证
plots: True          # 绘制训练曲线

# ==================== 其他设置 ====================
seed: 42             # 随机种子，保证可复现
deterministic: True  # 确定性模式
verbose: True        # 详细输出

# ==================== 分阶段训练配置 ====================
# 第一阶段：预训练（冻结骨干网络）
phase1:
  freeze: 10         # 冻结前10层
  epochs: 50
  lr0: 0.001
  
# 第二阶段：全网络微调
phase2:
  freeze: 0          # 不冻结
  epochs: 150
  lr0: 0.01
