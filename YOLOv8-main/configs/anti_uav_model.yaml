# YOLOv8 模型配置 - 针对红外无人机检测优化
# 基于 yolov8s.yaml 修改

# ==================== 模型参数 ====================
nc: 1  # 类别数: 只有无人机(UAV)一个类别
depth_multiple: 0.33  # 模型深度缩放因子
width_multiple: 0.50  # 通道宽度缩放因子

# ==================== 锚框配置（Anchor-Free） ====================
# YOLOv8使用Anchor-Free设计，但可配置回归范围
reg_max: 16  # DFL的回归最大值

# ==================== 骨干网络（Backbone） ====================
backbone:
  # [from, repeats, module, args]
  # 输入层 - 针对红外图像优化
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2  下采样2倍
  
  # 早期特征提取 - 小目标检测关键
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4  下采样4倍
  - [-1, 3, C2f, [128, True]]   # 2  C2f模块，保留更多梯度流
  
  # 中层特征
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8  下采样8倍
  - [-1, 6, C2f, [256, True]]   # 4  更多C2f层增强特征提取
  
  # 中高层特征
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16 下采样16倍
  - [-1, 6, C2f, [512, True]]   # 6
  
  # 高层语义特征
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 下采样32倍
  - [-1, 3, C2f, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9  空间金字塔池化

# ==================== 特征融合网络（Neck） ====================
# PANet结构 - 双向特征融合
head:
  # 上采样分支（自顶向下）
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # 11  拼接P4特征
  - [-1, 3, C2f, [512]]        # 12  P4/16-medium

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # 14  拼接P3特征
  - [-1, 3, C2f, [256]]        # 15  P3/8-small（小目标检测关键层）

  # 下采样分支（自底向上）
  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17  拼接中层特征
  - [-1, 3, C2f, [512]]        # 18  P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]]  # 20  拼接高层特征
  - [-1, 3, C2f, [1024]]       # 21  P5/32-large

  # 检测头 - 多尺度检测
  - [[15, 18, 21], 1, Detect, [nc]]  # 22  Detect(P3, P4, P5)

# ==================== 检测头配置 ====================
Detect:
  # 针对红外小目标优化的检测头
  stride: [8, 16, 32]  # 三个检测层的步长
  
  # 解耦头配置
  no: 64  # 每个锚点的输出维度
  
  # 动态标签分配
  tal_topk: 10  # TaskAlignedAssigner的top-k

# ==================== 红外图像特定优化 ====================
# 小目标检测增强
small_object:
  # P3层（8倍下采样）专门针对小目标
  p3_stride: 8
  p3_anchor_size: 4  # 基础锚框大小
  
  # 多尺度训练
  multi_scale: True
  scale_range: [0.5, 1.5]  # 训练时的尺度变化范围

# 损失函数配置
loss:
  # 分类损失
  cls_loss: 'varifocal'  # Varifocal Loss更适合难例
  cls_weight: 0.5
  
  # 边框回归损失
  box_loss: 'ciou'  # Complete IoU
  box_weight: 7.5
  
  # 分布焦点损失
  dfl_loss: True
  dfl_weight: 1.5
  
  # 针对红外图像的损失调整
  # 红外图像中目标通常对比度较低，增加难例挖掘
  focal_gamma: 2.0  # Focal Loss的gamma参数
  focal_alpha: 0.25  # Focal Loss的alpha参数
