# experiments/sutrack/sutrack_b224_antiuav_mot_v2.yaml
# Motion-Aware Temporal Tracker (精简版)
# 改进:
#   - 保留 TTE (TemplateTemporalEncoder) + STCA (SearchTemplateCrossAttention)
#   - 移除 TMB (TrajectoryMemoryBank) — 训练/推理中从未更新，是死代码
#   - 移除 motion_smooth_loss — 无人机运动非线性，常速假设有害
#   - 提高 batch_size，匹配 standard baseline 的训练配置

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MULTI_MODAL_LANGUAGE: False
  MULTI_MODAL_VISION: True
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  STD:
  - 0.229
  - 0.224
  - 0.225
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 224
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 112
    NUMBER: 2
  TRAIN:
    DATASETS_NAME:
    - ANTIUAV
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  USE_MOTION_TEMPORAL: True
  ENCODER:
    TYPE: fastitpnb
    IN_CHANS: 6
    STRIDE: 16
    PRETRAIN_TYPE: 'pretrained/itpn/fast_itpn_base_clipl_e1600.pt'
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    TOKEN_TYPE_INDICATE: True
    USE_LINEAR_ATTN: False
  TASK_INDEX:
    ANTIUAV: 0
  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: True
  TASK_DECODER:
    NUM_CHANNELS: 256
    FEATURE_TYPE: average
  TASK_NUM: 1

TRAIN:
  TYPE: normal
  ENCODER_MULTIPLIER: 0.1
  BATCH_SIZE: 40
  EPOCH: 180
  GRAD_CLIP_NORM: 0.0
  LR: 0.0001
  LR_DROP_EPOCH: 90
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 10
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
  FREEZE_ENCODER: False
  AMP: True
  MOTION_SMOOTH_WEIGHT: 0.0
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  CE_WEIGHT: 1.0
  TASK_CE_WEIGHT: 1.0

TEST:
  EPOCH: 180
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  WINDOW: True
  NUM_TEMPLATES: 2
  UPDATE_INTERVALS:
    DEFAULT: 999999
  UPDATE_THRESHOLD:
    DEFAULT: 1
 